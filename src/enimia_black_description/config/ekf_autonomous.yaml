ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.2
    print_diagnostics: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /odom
    odom0_config: [
      false, false, false,   # x, y, z
      false, false, false,   # roll, pitch, yaw (handled by IMU)
      true,  true,  false,   # vx, vy, vz (velocity from wheel odometry)
      false, false, true,    # vroll, vpitch, vyaw (angular velocity from steering kinematics)
      false, false, false    # ax, ay, az
    ]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    imu0: /imu/data
    imu0_config: [
      false, false, false,   # x, y, z
      false, false, true,    # roll, pitch, yaw (absolute yaw from IMU)
      false, false, false,   # vx, vy, vz
      false, false, true,    # vroll, vpitch, vyaw (gyro rate)
      false, false, false    # ax, ay, az (disabled to prevent drift/jitter)
    ]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

