controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # The vehicle has two steering joints but only one driven rear wheel.
    # The upstream AckermannSteeringController requires two drive joints, so
    # the Ackermann kinematics are handled by tricycle_ackermann_controller.py
    # and these controllers expose the real hardware interfaces to Gazebo.
    front_steering_controller:
      type: position_controllers/JointGroupPositionController

    rear_wheel_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

front_steering_controller:
  ros__parameters:
    joints:
      - front_left_steer_joint
      - front_right_steer_joint

rear_wheel_velocity_controller:
  ros__parameters:
    joints:
      - rear_wheel_joint
