# Nav2 configuration for ENIMIA Black.
# The vehicle is a non-holonomic tricycle: two front steering wheels and one
# rear driven wheel.  All radii below are based on wheelbase 1.704 m, front
# track 0.567 m and the 0.35 rad steering limit (minimum centre radius 4.95 m).

amcl:
  ros__parameters:
    use_sim_time: true
    # Conservative motion uncertainty prevents particle collapse during the
    # long, repetitive middle section of the circuit.
    alpha1: 0.10
    alpha2: 0.10
    alpha3: 0.12
    alpha4: 0.12
    alpha5: 0.0
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /livox/scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    max_beams: 180
    min_particles: 1000
    max_particles: 5000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    save_pose_rate: 0.5
    transform_tolerance: 1.0
    update_min_d: 0.10
    update_min_a: 0.08
    laser_min_range: 0.5
    # Distant Gazebo rays often traverse map areas that were never observed;
    # retaining the reliable local structure avoids false AMCL jumps.
    laser_max_range: 25.0
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.15
    z_hit: 0.85
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.05
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.7
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    tf_broadcast: true
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    odom_topic: /odometry/filtered
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [position_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.30
      movement_time_allowance: 25.0

    # A car cannot achieve an arbitrary final yaw at zero speed.  The position
    # checker declares success once the rear axle reaches the requested point.
    position_goal_checker:
      plugin: nav2_controller::PositionGoalChecker
      xy_goal_tolerance: 0.35
      stateful: true

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # Approximately 20 km/h on the straights.
      desired_linear_vel: 5.6
      min_lookahead_dist: 1.8
      max_lookahead_dist: 4.5
      lookahead_time: 0.80
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.30
      min_approach_linear_velocity: 0.50
      approach_velocity_scaling_dist: 4.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.50
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      # Do not pre-emptively crawl before the kR_in right bend; the dedicated
      # lane controller applies its safe 4.2 m/s curve speed.
      regulated_linear_scaling_min_radius: 2.50
      regulated_linear_scaling_min_speed: 3.8
      cost_scaling_dist: 0.70
      cost_scaling_gain: 1.50
      inflation_cost_scaling_factor: 3.0
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 1.50
      use_rotate_to_heading: false
      allow_reversing: false
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 8.0
      publish_frequency: 4.0
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05
      # ENIMIA Black: 2.684 m long x 0.770 m wide, expressed about the
      # base_footprint at the middle of the wheelbase, plus a small margin.
      footprint: "[[1.50, 0.44], [1.50, -0.44], [-1.30, -0.44], [-1.30, 0.44]]"
      footprint_padding: 0.03
      transform_tolerance: 0.5
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: livox_scan
        livox_scan:
          topic: /livox/scan
          data_type: LaserScan
          clearing: true
          marking: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.5
          obstacle_max_range: 12.0
          raytrace_min_range: 0.5
          raytrace_max_range: 15.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.70
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[1.50, 0.44], [1.50, -0.44], [-1.30, -0.44], [-1.30, 0.44]]"
      footprint_padding: 0.03
      transform_tolerance: 0.5
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        transform_tolerance: 0.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.80
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.35
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 2.0
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      minimum_turning_radius: 5.00
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 20.0
      lookup_table_size: 25.0
      cache_obstacle_heuristic: true
      smooth_path: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    behavior_plugins: [backup, assisted_teleop, wait]
    backup:
      plugin: nav2_behaviors/BackUp
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    wait:
      plugin: nav2_behaviors/Wait

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: CLOSED_LOOP
    max_velocity: [6.2, 0.0, 2.0]
    min_velocity: [-1.0, 0.0, -1.5]
    max_accel: [7.0, 0.0, 2.4]
    max_decel: [-6.0, 0.0, -2.5]
    odom_topic: /odometry/filtered
    odom_duration: 0.20
    deadband_velocity: [0.02, 0.0, 0.02]
    velocity_timeout: 1.0
