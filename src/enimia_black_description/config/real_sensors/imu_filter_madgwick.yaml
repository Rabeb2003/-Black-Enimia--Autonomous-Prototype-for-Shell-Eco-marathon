imu_filter:
  ros__parameters:
    # OAK IMU has no magnetometer stream usable here.
    use_mag: false
    publish_tf: false
    reverse_tf: false
    fixed_frame: odom
    world_frame: enu
    gain: 0.1
    zeta: 0.0
    orientation_stddev: 0.0
    publish_debug_topics: false
    stateless: false
    constant_dt: 0.0
